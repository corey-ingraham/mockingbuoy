[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mockingbuoy"
version = "0.1.0"
description = "Multi-port NMEA 0183 simulator/generator with a web UI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pyserial>=3.5",
    "pynmea2>=1.19.0",
    "pyais>=3.1",
    "geographiclib>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "janus>=1.0",
    "passlib[argon2]>=1.7.4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "black>=24.3",
    "mypy>=1.9",
    "pytest>=8.0",
    "pip-tools>=7.4",
    "httpx>=0.27",
]

[project.scripts]
mockingbuoy = "main:main"
mockingbuoy-mon = "nmea_sim.cli_monitor:main"
mockingbuoy-ais-profile = "nmea_sim.aisprofile.__main__:main"

[tool.setuptools]
packages = ["nmea_sim", "nmea_sim.aisprofile", "web"]
py-modules = ["main"]

[tool.setuptools.package-data]
# Ship the single-page web UI inside the wheel/sdist so a plain `pip install mockingbuoy`
# can serve `GET /`. Without this the build omits web/static/* and the root route 500s
# (the app resolves the UI from `web/static/` relative to the package). Use a glob, not a
# filename, so renamed or added static assets ship too.
web = ["static/*"]
# NOTE (M21, partial): the tracked `config.json` baseline is a repo-root file, not part of
# any package, so it cannot be shipped via package-data. Shipping it in the wheel needs it
# moved into a package + loaded via importlib.resources (web/app.py), or a MANIFEST.in for
# the sdist — both outside this group's file ownership. Deployed installs are unaffected
# (setup.sh syncs config.json into WorkingDirectory=/opt/mockingbuoy); only a bare
# `pip install mockingbuoy` used as a library lacks the baseline. Tracked as deferred.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true
files = ["nmea_sim", "web", "main.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
