repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        # Parity with CI mypy (`mypy` with no args reads [tool.mypy] in pyproject.toml:
        # disallow_untyped_defs, warn_unused_ignores, python 3.11, files=nmea_sim/web/main).
        # The old `--ignore-missing-imports` override left the hook far weaker than CI, so a
        # commit passed the hook then failed the CI type gate. pass_filenames:false + no args
        # makes the hook type-check the SAME configured file set the CI job does.
        pass_filenames: false
        args: []
        additional_dependencies: []
