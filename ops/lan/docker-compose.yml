# Local DNS for the appliance — AdGuard Home.
#
# Resolves the friendly subdomains (mockingbuoy.eemslab.internal, netbox.eemslab.internal, ...) to the
# box so Caddy can route them. Set BOX_IP in ops/lan/.env (copy .env.example). See ops/lan/README.md
# for the full setup incl. the *.eemslab.internal wildcard rewrite, systemd-resolved :53 handling, the
# Firefox-DoH canary, pointing LAN clients at this DNS, and trusting Caddy's local CA.

services:
  adguardhome:
    image: adguard/adguardhome:latest
    container_name: adguardhome
    restart: unless-stopped
    ports:
      # DNS faces the LAN — bind to the box's LAN IP, NOT 0.0.0.0, so it does not collide with
      # systemd-resolved's stub listener on 127.0.0.53:53 (see README if `ss -lunp | grep :53` still
      # shows a conflict). BOX_IP must be the box's static/reserved primary LAN IP.
      - "${BOX_IP}:53:53/tcp"
      - "${BOX_IP}:53:53/udp"
      # Admin UI — loopback ONLY (reach it via `ssh -L 3000:127.0.0.1:3000 box`, or front it with its
      # own conf.d snippet). Never expose the UI to the LAN. Pick UI port 3000 in the setup wizard.
      - "127.0.0.1:3000:3000/tcp"
    volumes:
      - ./adguard/work:/opt/adguardhome/work
      - ./adguard/conf:/opt/adguardhome/conf
