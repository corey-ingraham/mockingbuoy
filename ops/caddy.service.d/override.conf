# systemd drop-in for the DISTRO-PACKAGED caddy.service — points native Caddy at
# this repo's Caddyfile and supplies the site + Basic-auth env from the secrets file.
#
# Install:
#   sudo mkdir -p /etc/systemd/system/caddy.service.d
#   sudo install -m 0644 ops/caddy.service.d/override.conf \
#        /etc/systemd/system/caddy.service.d/override.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart caddy
#
# Verify it took effect:
#   systemctl cat caddy        # the override block appears after the vendor unit
#   caddy validate --config /opt/mockingbuoy/Caddyfile
#
# The distro unit's ExecStart is cleared first (single empty assignment) and then
# replaced so Caddy loads OUR Caddyfile instead of /etc/caddy/Caddyfile.

[Service]
# MOCKINGBUOY_SITE / MOCKINGBUOY_BASIC_USER / MOCKINGBUOY_BASIC_HASH live here
# (git-ignored, 0600, generated on-device). Leading '-' => not an error if absent.
EnvironmentFile=-/opt/mockingbuoy/secrets/service.env

# Let caddy connect to the app's group-accessible unix socket. The socket at
# /run/mockingbuoy/app.sock is created 0660 mockingbuoy:mockingbuoy by the app's
# RuntimeDirectory/UMask; caddy joins the mockingbuoy group here so it can open it.
# (Without this the reverse_proxy to unix//run/mockingbuoy/app.sock gets EACCES.)
SupplementaryGroups=mockingbuoy

# NOTE: never add --environ here — it prints the whole process environment (including the
# Basic-auth hash loaded from service.env) to the journal on every start/reload.
ExecStart=
ExecStart=/usr/bin/caddy run --config /opt/mockingbuoy/Caddyfile --adapter caddyfile

# admin off => reconfigure via 'systemctl restart caddy', not reload.
# The Caddyfile disables the admin API ({ admin off }), and `caddy reload` works by
# POSTing the new config to that admin endpoint — so a reload would FAIL with the API
# unavailable. We therefore CLEAR the vendor ExecReload and deliberately do NOT provide
# a replacement: `systemctl reload caddy` becomes a no-op, and the supported way to apply
# a Caddyfile change is a RESTART (systemctl restart caddy), which re-reads the file.
ExecReload=
