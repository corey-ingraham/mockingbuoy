# systemd drop-in for the DISTRO-PACKAGED caddy.service.
#
# COEXISTENCE MODEL: native Caddy loads the SHARED host Caddyfile (/etc/caddy/Caddyfile),
# which `import`s every site under /etc/caddy/conf.d/*.caddy. mockingbuoy owns ONLY its own
# snippet (/etc/caddy/conf.d/mockingbuoy.caddy) — so NetBox and any other reverse-proxy sites
# on this box keep working across a mockingbuoy redeploy. This drop-in exists to (a) strip the
# vendor unit's --environ flag (which would print secrets to the journal), (b) supply the site +
# Basic-auth env, and (c) let Caddy reach the app's group-owned unix socket.
#
# Install:
#   sudo mkdir -p /etc/systemd/system/caddy.service.d
#   sudo install -m 0644 ops/caddy.service.d/override.conf \
#        /etc/systemd/system/caddy.service.d/override.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart caddy
#
# Verify:
#   systemctl cat caddy        # the override block appears after the vendor unit
#   caddy validate --config /etc/caddy/Caddyfile

[Service]
# MOCKINGBUOY_SITE / MOCKINGBUOY_SITE_ALIAS / MOCKINGBUOY_BASIC_USER / MOCKINGBUOY_BASIC_HASH live
# here (git-ignored, 0600, generated on-device). Leading '-' => not an error if absent. REQUIRED:
# without this the imported snippet's {$MOCKINGBUOY_BASIC_HASH} expands empty and the WHOLE combined
# config (every site) fails to load. Never delete this line.
EnvironmentFile=-/opt/mockingbuoy/secrets/service.env

# Let caddy connect to the app's group-accessible unix socket. The socket at
# /run/mockingbuoy/app.sock is created 0660 mockingbuoy:mockingbuoy by the app's
# RuntimeDirectory/UMask; caddy joins the mockingbuoy group here so it can open it.
# (Without this the reverse_proxy to unix//run/mockingbuoy/app.sock gets EACCES.)
SupplementaryGroups=mockingbuoy

# Point Caddy at the SHARED host Caddyfile (not mockingbuoy's own file) so it serves every
# imported site. The vendor ExecStart is cleared first (single empty assignment) then replaced.
# NEVER add --environ here — it prints the whole process environment (including the Basic-auth
# hash loaded from service.env) to the journal on every start/reload.
ExecStart=
ExecStart=/usr/bin/caddy run --config /etc/caddy/Caddyfile --adapter caddyfile

# Config changes are applied by RESTART, not reload: the shared Caddyfile ships `admin off`
# (no admin API to POST a reload to), and a reload on the cutover deploy would no-op against the
# still-running process. The vendor ExecReload is cleared with no replacement so
# `systemctl reload caddy` is an explicit no-op; `systemctl restart caddy` re-reads the config.
ExecReload=
